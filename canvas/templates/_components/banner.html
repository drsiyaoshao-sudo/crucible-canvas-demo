{% macro banner(kind, title, body) %}
<div class="banner {{ kind }}">
  <span style="font-family:var(--font-mono);font-size:12px">
    {% if kind == 'warn' %}⚠{% elif kind == 'error' %}✗{% elif kind == 'ok' %}✓{% else %}·{% endif %}
  </span>
  <div>
    <strong>{{ title }}</strong> — {{ body }}
  </div>
</div>
{% endmacro %}
