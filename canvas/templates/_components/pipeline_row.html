{% macro pipeline_row(job_type, label, accent='emerald') %}
<div class="flex items-center justify-between gap-2">
  <div class="flex items-center gap-2.5" style="font-size:13px;color:var(--fg-mute)">
    <template x-if="jobs.{{ job_type }}.status === 'idle'">
      <span style="color:var(--fg-soft)">●</span>
    </template>
    <template x-if="jobs.{{ job_type }}.status === 'running'">
      <span class="spinner" style="color:var(--ember)"></span>
    </template>
    <template x-if="jobs.{{ job_type }}.status === 'done'">
      <span style="color:var(--ember)">✓</span>
    </template>
    <template x-if="jobs.{{ job_type }}.status === 'error'">
      <span style="color:#f87171">✗</span>
    </template>
    <span>{{ label }}</span>
    {{ caller() if caller else '' }}
  </div>
  <button class="btn-row accent-{{ accent }}"
          :disabled="jobs.{{ job_type }}.status === 'running'"
          @click="runJob('{{ job_type }}')">
    <span x-text="jobs.{{ job_type }}.status === 'running' ? 'running…' : (jobs.{{ job_type }}.status === 'done' ? 're-run' : 'run')">run</span>
  </button>
</div>
{% endmacro %}
