{% macro section_label(text) %}
<div class="section-label">{{ text }}</div>
{% endmacro %}

{# Full § section header — § NN · EYEBROW ─── meta #}
{% macro section_header(num, eyebrow, meta=None) %}
<div class="section-header">
  <span class="num">§&nbsp;{{ '%02d' % num }}</span>
  <span style="color:var(--fg-soft)">·</span>
  <span>{{ eyebrow }}</span>
  <span class="leader"></span>
  {% if meta %}<span class="meta">{{ meta }}</span>{% endif %}
</div>
{% endmacro %}
