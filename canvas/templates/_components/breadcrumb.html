{% macro breadcrumb(items) %}
<div class="breadcrumb">
  {% for label, href in items %}
    {% if href %}<a href="{{ href }}">{{ label }}</a>{% else %}<span class="current">{{ label }}</span>{% endif %}
    {% if not loop.last %}<span class="sep">›</span>{% endif %}
  {% endfor %}
</div>
{% endmacro %}
