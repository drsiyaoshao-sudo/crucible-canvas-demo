<!DOCTYPE html>
<html lang="en" class="h-full" style="background:#030712">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Crucible-Canvas{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
  <link rel="stylesheet" href="/static/css/crucible.css">
</head>
<body class="min-h-full text-gray-100" style="background:#030712">

  <nav class="border-b border-gray-800/70 sticky top-0 z-50" style="background:rgba(3,7,18,.85);backdrop-filter:blur(12px)">
    <div class="max-w-7xl mx-auto px-6 flex items-center gap-1" style="height:52px">

      <!-- Logo -->
      <a href="/dashboard" class="flex items-center gap-2 mr-3 shrink-0 group">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="text-emerald-400 group-hover:text-emerald-300 transition-colors">
          <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M12 2L12 22M3 7L21 17M21 7L3 17" stroke="currentColor" stroke-width="1" stroke-opacity=".4"/>
        </svg>
        <span style="font-size:13px;font-weight:600;letter-spacing:-.01em">
          <span class="text-white">crucible</span><span class="text-emerald-500">-canvas</span>
        </span>
      </a>

      <!-- Divider -->
      <div class="w-px h-4 bg-gray-800 mx-2 shrink-0"></div>

      <!-- Nav links -->
      {%- set p = request.url.path -%}
      <a href="/dashboard" class="nav-link {% if '/dashboard' in p or '/product/' in p or '/compliance/' in p or '/ip/' in p %}active{% endif %}">dashboard</a>
      <a href="/graph"     class="nav-link {% if '/graph' in p %}active{% endif %}">graph</a>
      <a href="/console"   class="nav-link {% if '/console' in p %}active{% endif %}" style="color:#c084fc">⚖ console</a>
      <a href="/hil"       class="nav-link {% if '/hil' in p %}active{% endif %}" style="color:#fbbf24">◈ hil</a>

      <div class="flex-1"></div>

      <!-- Live indicator -->
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0" style="box-shadow:0 0 6px rgba(16,185,129,.7)"></span>
        <span class="text-gray-600 text-xs">read-only</span>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
