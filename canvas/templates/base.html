<!DOCTYPE html>
<html lang="en" class="h-full" style="background:#0b0d12">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Crucible — Canvas{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/crucible.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-full" style="background:#0b0d12;color:#ecedf3">

  <nav style="position:sticky;top:0;z-index:50;background:rgba(11,13,18,0.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)">
    <div class="max-w-7xl mx-auto px-6 flex items-center" style="height:64px">

      <!-- Wordmark -->
      <a href="/dashboard" class="flex items-center mr-8 shrink-0" aria-label="Crucible">
        <svg viewBox="0 0 220 48" width="132" height="28" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(4,8)">
            <path d="M25 9.5A11 11 0 1 0 25 22.5" fill="none" stroke="#ECEDF3" stroke-width="2.75" stroke-linecap="round"></path>
            <circle cx="25" cy="22.5" r="3.75" fill="#34D399"></circle>
          </g>
          <text x="46" y="32" fill="#ECEDF3" font-family="'Geist','IBM Plex Sans',system-ui,sans-serif" font-weight="600" font-size="24" letter-spacing="-0.6">Crucible</text>
        </svg>
      </a>

      <!-- Nav links -->
      {%- set p = request.url.path -%}
      <a href="/dashboard" class="nav-link {% if '/dashboard' in p or '/product/' in p or '/compliance/' in p or '/ip/' in p %}active{% endif %}">Canvas</a>
      <a href="/graph"     class="nav-link {% if '/graph' in p %}active{% endif %}">Graph</a>
      <a href="/console"   class="nav-link {% if '/console' in p %}active{% endif %}">Console</a>
      <a href="/hil"       class="nav-link {% if '/hil' in p %}active{% endif %}">HIL</a>

      <div class="flex-1"></div>

      <!-- Live indicator -->
      <div class="flex items-center gap-3" style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.22em;color:var(--fg-soft)">
        <span class="status-dot"></span>
        <span>Read-only · v1</span>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-12">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
